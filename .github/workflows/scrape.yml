name: Scrape and Store Kamas Prices

# Run every hour at the start of the hour (0:00, 1:00, 2:00, etc.)
on:
  schedule:
    - cron: '0 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm start
      
      - name: Log success
        if: success()
        run: echo "✓ Successfully scraped and stored kamas prices"
      
      - name: Log failure
        if: failure()
        run: |
          echo "✗ Scraper failed"
          exit 1
